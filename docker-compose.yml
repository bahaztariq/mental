services:
  # -------------------------------------------------------------
  # 1. Streamlit Application
  # -------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mental_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - .:/opt/project
    environment:
      - PYTHONPATH=/opt/project:/opt/project/src
    networks:
      - mental_net

  # -------------------------------------------------------------
  # 2. Apache Airflow (Standalone: Webserver + Scheduler)
  # -------------------------------------------------------------
  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: mental_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=UTC
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      # Packages required inside Airflow for running pipelines and importing project modules
      - _PIP_ADDITIONAL_REQUIREMENTS=scikit-learn pandas imbalanced-learn joblib matplotlib seaborn
      - PYTHONPATH=/opt/project:/opt/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/project
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin 2>/dev/null || true
        exec airflow standalone
      "
    networks:
      - mental_net

networks:
  mental_net:
    driver: bridge
